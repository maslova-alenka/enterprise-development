syntax = "proto3";

option csharp_namespace = "Polyclinic.Grpc.Protos";

package polyclinic;

message AppointmentResponse {
  int32 patient_id = 1;
  int32 doctor_id = 2;
  string appointment_date = 3;
  int32 room_number = 4;
  bool is_follow_up = 5;
}

message GenerationCallback {
  bool success = 1;
  string error = 2;
}

service PolyclinicGenerator {
  rpc StreamAppointments (stream AppointmentResponse) returns (stream GenerationCallback);
}